# Plane CE — public entrypoint (Caddy reverse proxy)
# All upstreams are private Fly apps reachable over 6PN (*.internal).
app = "plane-trap"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  SITE_ADDRESS = ":80"
  FILE_SIZE_LIMIT = "5242880"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[vm]
  size = "shared-cpu-1x"
  memory_mb = 256
